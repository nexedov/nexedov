<svg width="840" height="170" viewBox="0 0 840 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .canvas { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
    .node-active { fill: #161b22; stroke: #388bfd; stroke-width: 1px; }
    .title { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11px 'SFMono-Regular', Consolas, monospace; fill: #8b949e; }
    .badge { font: 500 10px 'SFMono-Regular', Consolas, monospace; fill: #58a6ff; }
    .wire { stroke: #30363d; stroke-width: 1.5px; }
    .flow {
      stroke: #58a6ff;
      stroke-width: 1.5px;
      stroke-dasharray: 6 18;
      animation: stream 1.2s linear infinite;
    }
    .status-ok { fill: #3fb950; }
    .status-guard { fill: #d29922; }
    @keyframes stream {
      to { stroke-dashoffset: -24; }
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="169" rx="6" class="canvas" />

  <line x1="195" y1="85" x2="235" y2="85" class="wire" />
  <line x1="195" y1="85" x2="235" y2="85" class="flow" />

  <line x1="405" y1="85" x2="445" y2="85" class="wire" />
  <line x1="405" y1="85" x2="445" y2="85" class="flow" />

  <line x1="615" y1="85" x2="655" y2="85" class="wire" />
  <line x1="615" y1="85" x2="655" y2="85" class="flow" />

  <g transform="translate(25, 38)">
    <rect width="170" height="94" rx="6" class="node" />
    <circle cx="16" cy="20" r="3.5" class="status-guard" />
    <text x="26" y="24" class="badge">INGRESS LAYER</text>
    <text x="16" y="50" class="title">Throttling & Guard</text>
    <text x="16" y="68" class="sub">Anti-Flood Middleware</text>
    <text x="16" y="82" class="sub">Rate-Limit Filter</text>
  </g>

  <g transform="translate(235, 38)">
    <rect width="170" height="94" rx="6" class="node-active" />
    <circle cx="16" cy="20" r="3.5" class="status-ok" />
    <text x="26" y="24" class="badge">ASYNC ENGINE</text>
    <text x="16" y="50" class="title">Aiogram 3 Core</text>
    <text x="16" y="68" class="sub">asyncio + aiohttp</text>
    <text x="16" y="82" class="sub">Single-Message UI</text>
  </g>

  <g transform="translate(445, 38)">
    <rect width="170" height="94" rx="6" class="node" />
    <circle cx="16" cy="20" r="3.5" class="status-ok" />
    <text x="26" y="24" class="badge">DATA & STATE</text>
    <text x="16" y="50" class="title">In-Memory Cache</text>
    <text x="16" y="68" class="sub">TTL 10m State Store</text>
    <text x="16" y="82" class="sub">REST API Integrations</text>
  </g>

  <g transform="translate(655, 38)">
    <rect width="160" height="94" rx="6" class="node" />
    <circle cx="16" cy="20" r="3.5" class="status-ok" />
    <text x="26" y="24" class="badge">MEDIA DELIVERY</text>
    <text x="16" y="50" class="title">Zero-Disk Stream</text>
    <text x="16" y="68" class="sub">Telegram Cloud</text>
    <text x="16" y="82" class="sub">via native file_id</text>
  </g>
</svg>
