import asyncio
import base64
import html
import time
from datetime import datetime, timezone
import aiohttp
from aiogram import Bot, Dispatcher, F
from aiogram.filters import Command, CommandObject
from aiogram.types import Message

BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN"
GITHUB_TOKEN = "YOUR_GITHUB_CLASSIC_OR_FINE_GRAINED_PAT"
GITHUB_REPO = "nexedov/nexedov"
SVG_PATH = "assets/live_status.svg"

bot = Bot(token=BOT_TOKEN)
dp = Dispatcher()
start_time = time.time()
cooldowns: dict[int, float] = {}


def render_svg(username: str, text: str, uptime_hours: int) -> str:
    safe_user = html.escape(username[:20])
    safe_text = html.escape(text[:55])
    now_str = datetime.now(timezone.utc).strftime("%H:%M UTC")

    return f"""<svg width="840" height="96" viewBox="0 0 840 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg {{ fill: #0d1117; stroke: #30363d; stroke-width: 1px; }}
    .header {{ font: 600 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }}
    .msg {{ font: 400 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e6edf3; }}
    .accent {{ fill: #58a6ff; }}
    .meta {{ font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }}
    .dot {{ fill: #3fb950; animation: pulse 2.5s infinite ease-in-out; }}
    @keyframes pulse {{ 0%, 100% {{ opacity: 1; }} 50% {{ opacity: 0.35; }} }}
  </style>
  <rect x="0.5" y="0.5" width="839" height="95" rx="6" class="bg"/>
  
  <circle cx="24" cy="28" r="4" class="dot"/>
  <text x="36" y="32" class="header">LIVE TELEMETRY // TELEGRAM GATEWAY</text>
  <text x="816" y="32" text-anchor="end" class="meta">Uptime: {uptime_hours}h • {now_str}</text>
  
  <line x1="1" y1="48" x2="839" y2="48" stroke="#21262d" stroke-width="1"/>
  
  <text x="20" y="73" class="msg">
    <tspan class="accent">@{safe_user}</tspan><tspan fill="#8b949e">:</tspan> {safe_text}
  </text>
</svg>"""


async def push_svg_to_github(svg_content: str) -> bool:
    url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{SVG_PATH}"
    headers = {
        "Authorization": f"Bearer {GITHUB_TOKEN}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
    }

    async with aiohttp.ClientSession(headers=headers) as session:
        async with session.get(url) as resp:
            sha = (await resp.json()).get("sha") if resp.status == 200 else None

        payload = {
            "message": "chore: update live telemetry svg",
            "content": base64.b64encode(svg_content.encode("utf-8")).decode("utf-8"),
        }
        if sha:
            payload["sha"] = sha

        async with session.put(url, json=payload) as put_resp:
            return put_resp.status in (200, 201)


@dp.message(Command("log"))
async def handle_log(message: Message, command: CommandObject):
    user_id = message.from_user.id
    now = time.time()

    if now - cooldowns.get(user_id, 0) < 30:
        await message.reply("Подожди 30 секунд перед следующим обновлением.")
        return

    if not command.args or not command.args.strip():
        await message.reply("Формат: `/log Текст сообщения`", parse_mode="Markdown")
        return

    cooldowns[user_id] = now
    username = message.from_user.username or message.from_user.first_name or "anon"
    uptime_h = int((now - start_time) // 3600)

    svg_data = render_svg(username, command.args.strip(), uptime_h)
    ok = await push_svg_to_github(svg_data)

    if ok:
        await message.reply("Запись отправлена в профиль GitHub.")
    else:
        await message.reply("Ошибка при обращении к GitHub API.")


async def main():
    await dp.start_polling(bot)


if __name__ == "__main__":
    asyncio.run(main())
